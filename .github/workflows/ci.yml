name: CI

on:
  push:
    branches: [AH2_V3-1]
  pull_request:
    branches: [AH2_V3-1]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: AH2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/AH2
      JWT_SECRET: ci-only-fake-secret-never-use-in-production-a1b2c3d4
      JWT_ALGORITHM: HS256
      AH2_API_BASE: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create app_medical role (RLS policy dependency)
        run: psql "$DATABASE_URL" -c "CREATE ROLE app_medical;"

      - name: Restore schema (schema-only, no data)
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f ci/schema_only.sql

      - name: Seed application_roles reference data
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f ci/seed_application_roles.sql

      - name: Stamp Alembic history (schema already matches head, never run migrations against a fresh DB)
        run: python -m alembic stamp head

      - name: Run test suite
        run: python -m pytest tests/ -v
