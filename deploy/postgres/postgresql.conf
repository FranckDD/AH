# Reglages Postgres de production pour un VPS de 8 Go (limite conteneur 1,5 Go).
# Le fuseau et wal_level sont aussi passes en -c dans le compose (les -c l'emportent).
listen_addresses = '*'
max_connections = 100
shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 96MB
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
# Un slot de replication inactif ne doit pas remplir le disque sans limite
max_slot_wal_keep_size = 4GB
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 256MB
timezone = 'Africa/Douala'
log_timezone = 'Africa/Douala'
log_min_duration_statement = 1000
log_checkpoints = on
